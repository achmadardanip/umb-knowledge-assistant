name: UMB Freshness Crawl

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      crawl_max_pages:
        description: "Maximum public pages to refresh"
        required: false
        default: "500"
      multimodal_max_files:
        description: "Maximum public assets to refresh"
        required: false
        default: "200"

jobs:
  refresh-rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      AI_PROVIDER: openrouter
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-small
      DISCOVERY_DOMAIN: mercubuana.ac.id
      ALLOWED_DOMAIN: mercubuana.ac.id
      DISCOVERY_RATE_LIMIT: "1"
      CRAWLER_RATE_LIMIT: "1"
      ENABLE_FFUF: "false"
      ENABLE_DIRSEARCH: "false"
      ENABLE_OCR: "false"
      ENABLE_ASR: "false"
      ENABLE_VIDEO_DOWNLOAD: "false"
      SCHEDULED_CRAWL_MAX_PAGES: ${{ inputs.crawl_max_pages || '500' }}
      SCHEDULED_MULTIMODAL_MAX_FILES: ${{ inputs.multimodal_max_files || '200' }}
      GRAPH_PATH: ../data/graph/umb_graph.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Supabase database connection
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db.database import get_engine

          try:
              with get_engine().connect() as connection:
                  connection.execute(text("select 1"))
          except Exception as exc:
              message = str(exc)
              print("Database connection failed.")
              if "Network is unreachable" in message or "@db." in message:
                  print(
                      "GitHub-hosted runners often cannot reach the direct Supabase IPv6 host. "
                      "Add a repository secret named SUPABASE_POOLER_DATABASE_URL using the "
                      "Supabase Session/Transaction Pooler connection string, then rerun this workflow."
                  )
              raise
          PY

      - name: Prepare runtime data directories
        run: |
          mkdir -p ../data/discovery ../data/multimodal ../data/downloads/raw ../data/graph

      - name: Merge and filter discovered URLs
        run: python -m app.discovery.discovery_pipeline merge-filter --domain mercubuana.ac.id

      - name: Firecrawl map + search discovery (optional)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_BASE_URL: ${{ secrets.FIRECRAWL_BASE_URL || 'https://api.firecrawl.dev/v2' }}
        run: |
          if [ -n "$FIRECRAWL_API_KEY" ] || [ -n "${{ secrets.FIRECRAWL_BASE_URL }}" ]; then
            python -m app.ingestion.firecrawl_pipeline discover --domain mercubuana.ac.id --confirm-authorized --limit 1000 || echo "Firecrawl discovery skipped/failed (non-fatal)."
          else
            echo "Firecrawl not configured (set FIRECRAWL_API_KEY or FIRECRAWL_BASE_URL secret); skipping map discovery."
          fi

      - name: Incremental crawl indexed public pages
        run: |
          if [ -s ../data/discovery/urls_filtered.txt ]; then
            python -m app.ingestion.pipeline crawl-discovered --max-pages "$SCHEDULED_CRAWL_MAX_PAGES" --rate-limit 1
          else
            python -m app.ingestion.pipeline crawl --domain mercubuana.ac.id --max-pages "$SCHEDULED_CRAWL_MAX_PAGES" --max-depth 3 --confirm-authorized
          fi

      - name: Incremental multimodal ingestion
        run: python -m app.multimodal.multimodal_pipeline run-all --max-files "$SCHEDULED_MULTIMODAL_MAX_FILES"

      - name: Rebuild GraphRAG knowledge graph
        run: python -m app.graph.build_graph

      - name: Upload sanitized reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umb-freshness-reports
          path: |
            data/discovery/discovery_report.json
            data/multimodal/extraction_report.json
            data/graph/umb_graph.json
          if-no-files-found: ignore
