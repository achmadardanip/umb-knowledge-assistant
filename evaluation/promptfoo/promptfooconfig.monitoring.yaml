# evaluation/promptfoo/promptfooconfig.monitoring.yaml
# Nightly RAG monitoring against the real /chat endpoint. Graded by local Ollama.
# Run by the promptfoo-scheduler container; results pushed to promptfoo-server.
description: UMB Chatbot — RAG monitoring (faithfulness/relevance) vs real /chat

# Two columns (same /chat endpoint, two retrieval modes) so the web viewer can render
# charts (it requires >=2 prompts/providers to compare) AND we get an A/B signal:
# indexed (KB-only) vs hybrid (KB + live web).
providers:
  - id: file://rag_chat_provider.py
    label: indexed
    config:
      retrieval_mode: indexed
  - id: file://rag_chat_provider.py
    label: hybrid
    config:
      retrieval_mode: hybrid

prompts:
  - "{{query}}"

defaultTest:
  options:
    provider: ollama:chat:qwen2.5:7b-instruct
  assert:
    # Named metrics so the web viewer aggregates numeric per-metric scores
    # (faithfulness/relevance/official_source) — these vary across tests, giving the
    # "Show Charts" view a real distribution instead of uniform pass/fail.
    - type: context-faithfulness
      contextTransform: context.metadata.context
      threshold: 0.7
      metric: faithfulness
    - type: llm-rubric
      value: "User question: \"{{query}}\". Judge whether the answer above directly and helpfully addresses THIS question (ignore factual correctness; judge relevance only). Pass if relevant."
      metric: relevance
    - type: javascript
      metric: official_source
      value: |
        const m = (context && context.metadata) || {};
        if (m.not_found) return { pass: true, score: 1, reason: 'refusal: no sources expected' };
        return m.official_source
          ? { pass: true, score: 1, reason: 'official sources' }
          : { pass: false, score: 0, reason: 'non-official or empty sources' };

tests:
  - file://scenarios.csv
  # Broad generated coverage, converted to Promptfoo CSV form (vars.query) from
  # datasets/rag_golden.json. Regenerate via the snippet in MONITORING.md when the slice changes.
  - file://golden_scenarios.csv

# Sharing target is set via the PROMPTFOO_REMOTE_API_BASE_URL / PROMPTFOO_REMOTE_APP_BASE_URL
# environment variables (set by the scheduler container and the smoke command), which
# `promptfoo eval --share` reads natively. No in-file sharing block (avoids literal ${VAR}).
outputPath: reports/promptfoo_monitoring_latest.json
