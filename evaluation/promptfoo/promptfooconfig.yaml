# Phase 21 — Promptfoo continuous-evaluation config for the UMB Knowledge Assistant.
#
# Two evaluation paths share these datasets:
#   * `python -m app.evaluation.promptfoo_runner` — the fast, deterministic gate
#     (entity + retrieval layers, no LLM) that asserts no regression (CI required check).
#   * `npx promptfoo eval -c evaluation/promptfoo/promptfooconfig.yaml` — the
#     Promptfoo view over the same datasets via the custom structured provider.
#
# Datasets (generated by app.evaluation.promptfoo_datasets from real entity data):
#   datasets/entity.json (208) · datasets/accreditation.json (103)
#   datasets/followup.json (102) · datasets/retrieval.json (500)  => 913 tests
description: UMB Knowledge Assistant — citation / hallucination / entity / follow-up evaluation

providers:
  - id: file://provider.py
    label: umb-structured-entity

prompts:
  - "{{query}}"

defaultTest:
  assert:
    # official-source: the answer must be backed by an official UMB host.
    - type: javascript
      value: |
        const h = (output && (output.hostname || (output.url||'').split('/')[2])) || '';
        return /(^|\.)mercubuana\.ac\.id$/.test(h)
          ? { pass: true, score: 1, reason: 'official source' }
          : { pass: false, score: 0, reason: 'non-official or empty source: ' + h };

tests:
  - file://datasets/entity.json
  - file://datasets/accreditation.json
  - file://datasets/followup.json
  - file://datasets/retrieval.json

outputPath: reports/promptfoo_latest.json
