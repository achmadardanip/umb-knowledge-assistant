# UMB Knowledge Assistant — full LOCAL deployment (no Supabase dependency).
#
#   docker compose -f docker-compose.local.yml up -d postgres pgadmin   # data + admin UI
#   docker compose -f docker-compose.local.yml up -d                    # full stack
#
# Then bootstrap + (optionally) migrate prod data into local:
#   LOCAL_POSTGRES_MODE=true python -m app.db.bootstrap_local
#   python -m app.db.supabase_to_local --target postgresql://postgres:postgres@localhost:5432/umb
#
# Endpoints:  backend http://localhost:8000/health · frontend http://localhost:3000
#             pgAdmin http://localhost:5050  (admin@local.dev / admin)

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: umb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umb
    ports:
      - "5432:5432"
    volumes:
      - umb_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umb"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: umb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: umb-redis-local
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: umb-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_POSTGRES_MODE: "true"
      LOCAL_POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/umb
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/umb
      VECTOR_DB: pgvector
      LOCAL_SQLITE_FALLBACK_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # python (not curl) — the slim image ships python, not curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: umb-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  promptfoo-server:
    image: ghcr.io/promptfoo/promptfoo:latest
    container_name: umb-promptfoo-server
    ports:
      - "3001:3000"   # host 3001 (frontend already uses 3000); UI at http://localhost:3001
    volumes:
      - promptfoo_data:/home/promptfoo/.promptfoo
    restart: unless-stopped

  promptfoo-scheduler:
    build: ./evaluation/promptfoo/scheduler
    container_name: umb-promptfoo-scheduler
    depends_on:
      - promptfoo-server
    environment:
      PROMPTFOO_REMOTE_API_BASE_URL: http://promptfoo-server:3000
      PROMPTFOO_REMOTE_APP_BASE_URL: http://promptfoo-server:3000
      UMB_CHAT_BASE_URL: http://host.docker.internal:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/work:ro
    restart: unless-stopped

volumes:
  umb_local_pgdata:
  promptfoo_data:
